# render.yaml — Render Infrastructure as Code Blueprint for Career Ops
# https://render.com/docs/blueprint-spec
#
# Deploy a secure, single-owner, persistent Career Ops instance.
# Note: Persistent disks require a paid plan (Starter or higher).

services:
  - type: web
    name: career-ops
    runtime: node
    plan: starter
    region: oregon
    buildCommand: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund && npm --prefix web ci --include=dev && npm --prefix web run build
    startCommand: node deploy/render-start.mjs
    healthCheckPath: /healthz
    disk:
      name: career-ops-data
      mountPath: /var/data/career-ops
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CAREER_OPS_ROOT
        value: /var/data/career-ops
      - key: CAREER_OPS_CLOUD
        value: "1"
      # Owner credentials (configured in Render Dashboard, sync: false keeps them private)
      - key: CAREER_OPS_AUTH_USER
        sync: false
      - key: CAREER_OPS_AUTH_PASSWORD_HASH
        sync: false
      - key: CAREER_OPS_SESSION_SECRET
        generateValue: true
      # Host validation (e.g. career-ops.onrender.com or custom domain)
      - key: CAREER_OPS_WEB_ALLOWED_HOSTS
        sync: false
      # Optional external AI Provider API Keys
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
